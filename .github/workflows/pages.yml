name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, work]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Build previous site for /v1
        run: |
          npm run build
          rm -rf /tmp/arduino-web-v1
          mkdir -p /tmp/arduino-web-v1
          cp -a dist/. /tmp/arduino-web-v1/
      - name: Build current Arduino editor for root
        run: |
          npm install --prefix dev
          npm --prefix dev run setup
          CI=true NODE_ENV=production ROOT=./ ROUTING_STYLE=wildcard npm --prefix dev/turbowarp-gui run build

          rm -rf dist
          mkdir -p dist
          cp -a dev/turbowarp-gui/build/. dist/
          cp dist/editor.html dist/index.html
          rm -f dist/addons.html

          mkdir -p dist/v1
          cp -a /tmp/arduino-web-v1/. dist/v1/

          # Preserve a configured custom-domain file if the previous site emitted one.
          if [ -f /tmp/arduino-web-v1/CNAME ]; then
            cp /tmp/arduino-web-v1/CNAME dist/CNAME
          fi

          # Keep old /dev links working, but the current editor now lives at root.
          mkdir -p dist/dev
          cat > dist/dev/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=../">
            <meta name="robots" content="noindex">
            <title>Arduino Web Coding</title>
            <script>location.replace('../');</script>
          </head>
          <body><a href="../">Open Arduino Web Coding</a></body>
          </html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
