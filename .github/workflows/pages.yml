name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, work]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Build root app
        run: npm run build
      - name: Build customized Arduino editor for /dev
        run: |
          npm install --prefix dev
          npm --prefix dev run setup
          cp dev/overrides/python-sync.js dev/turbowarp-gui/src/components/python-editor/python-sync.js
          CI=true NODE_ENV=production ROOT=./ ROUTING_STYLE=wildcard npm --prefix dev/turbowarp-gui run build
          rm -rf dist/dev
          mkdir -p dist/dev
          cp -a dev/turbowarp-gui/build/. dist/dev/
          cp dist/dev/editor.html dist/dev/index.html
          rm -f dist/dev/addons.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
